name: xeldash

services:
  daemon:
    image: ${XELIS_DAEMON_IMAGE:-xelis/daemon:latest}
    command:
      - --network=${XELIS_NETWORK:-devnet}
      - --rpc-bind-address=0.0.0.0:8080
      - --dir-path=/root/.xelis/
    restart: unless-stopped
    volumes:
      - xelis-data:/root/.xelis
    ports:
      - "${XELIS_P2P_BIND_IP:-127.0.0.1}:${XELIS_P2P_PORT:-2125}:2125"
    expose:
      - "8080"
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xeldash}
      POSTGRES_USER: ${POSTGRES_USER:-xeldash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # One-shot schema migration. api and stratum wait for it to complete successfully, so
  # neither service's startup depends on the other's health.
  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["node", "packages/db/src/migrate.js"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8081
      XELIS_RPC_URL: http://daemon:8080/json_rpc
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      daemon:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${XELDASH_API_BIND_IP:-127.0.0.1}:${XELDASH_API_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  stratum:
    build:
      context: .
      dockerfile: services/stratum/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      STRATUM_HOST: 0.0.0.0
      STRATUM_PORT: 3333
      STRATUM_HANDSHAKE_TIMEOUT_MS: ${STRATUM_HANDSHAKE_TIMEOUT_MS:-10000}
      STRATUM_MAX_QUEUED_REQUESTS: ${STRATUM_MAX_QUEUED_REQUESTS:-32}
      STRATUM_JOB_REFRESH_MS: ${STRATUM_JOB_REFRESH_MS:-5000}
      STRATUM_SHARE_DIFFICULTY: ${STRATUM_SHARE_DIFFICULTY:-1000000}
      XELIS_DEFAULT_ADDRESS: ${XELIS_DEFAULT_ADDRESS:-}
      XELIS_RPC_URL: http://daemon:8080/json_rpc
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      daemon:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${XELDASH_STRATUM_BIND_IP:-127.0.0.1}:${XELDASH_STRATUM_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('node:net');const s=n.connect(3333,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1));"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

volumes:
  xelis-data:
  postgres-data:

networks:
  backend:
    driver: bridge
