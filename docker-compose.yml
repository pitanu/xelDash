name: xeldash

# Images are built locally by default (tag `local`). To run a release instead, set
# XELDASH_VERSION (for example 0.1.0) and run `docker compose pull && docker compose up -d`.

services:
  daemon:
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/daemon:${XELDASH_VERSION:-local}
    build:
      context: docker/daemon
      args:
        XELIS_DAEMON_IMAGE: ${XELIS_DAEMON_IMAGE:-xelis/daemon:1.25.0}
    command:
      - --network=${XELIS_NETWORK:-devnet}
      - --rpc-bind-address=0.0.0.0:8080
      - --dir-path=/root/.xelis/
    restart: unless-stopped
    environment:
      # The entrypoint needs the network to find the database when swapping in a snapshot.
      XELIS_NETWORK: ${XELIS_NETWORK:-devnet}
    volumes:
      - xelis-data:/root/.xelis
    depends_on:
      # On a first start with XELIS_SNAPSHOT_AUTO, node-admin holds the node back until the
      # official snapshot is downloaded and unpacked.
      node-admin:
        condition: service_healthy
    ports:
      - "${XELIS_P2P_BIND_IP:-127.0.0.1}:${XELIS_P2P_PORT:-2125}:2125"
    expose:
      - "8080"
    healthcheck:
      # Waiting for a first-start snapshot counts as healthy, so the dashboard (which shows the
      # download) and Stratum (which pauses until the node is ready) can start meanwhile.
      test: ["CMD", "busybox", "sh", "-c", "test -f /root/.xelis/.xeldash/BOOTSTRAPPING || test -f /root/.xelis/.xeldash/STOP || busybox wget -q -O - --header 'Content-Type: application/json' --post-data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"get_version\"}' http://127.0.0.1:8080/json_rpc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # Node administration for the dashboard: daemon settings and snapshots, written to the node's
  # data volume and applied when the node restarts. Actions need XELDASH_ADMIN_TOKEN.
  # See docs/OPERATIONS.md#daemon-settings and #snapshots.
  node-admin:
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/node-admin:${XELDASH_VERSION:-local}
    build:
      context: .
      dockerfile: services/node-admin/Dockerfile
    restart: unless-stopped
    environment:
      XELIS_NETWORK: ${XELIS_NETWORK:-devnet}
      XELDASH_ADMIN_TOKEN: ${XELDASH_ADMIN_TOKEN:-}
      XELIS_SNAPSHOT_AUTO: ${XELIS_SNAPSHOT_AUTO:-false}
      XELIS_SNAPSHOT_URL: ${XELIS_SNAPSHOT_URL:-}
      XELIS_SNAPSHOT_CHECKSUM_URL: ${XELIS_SNAPSHOT_CHECKSUM_URL:-}
      # Mining fallback through the official public node; the dashboard switch overrides it.
      XELIS_OFFICIAL_FALLBACK: ${XELIS_OFFICIAL_FALLBACK:-false}
      XELIS_OFFICIAL_NODE_URL: ${XELIS_OFFICIAL_NODE_URL:-}
      # Optional, off by default: update both local nodes to new releases by themselves (needs
      # the redundant profile). The dashboard switch overrides it after the first start.
      XELIS_AUTO_UPDATE: ${XELIS_AUTO_UPDATE:-false}
      XELIS_AUTO_UPDATE_DELAY_HOURS: ${XELIS_AUTO_UPDATE_DELAY_HOURS:-24}
      # The address to mine to, chosen on the dashboard's setup page; this is its first value.
      XELIS_DEFAULT_ADDRESS: ${XELIS_DEFAULT_ADDRESS:-}
      # Node actions (version switches, stops, copies) are recorded as events for the
      # dashboard and alerts.
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - xelis-data:/data
      # daemon2's data (redundant profile), so its snapshots and settings can be managed too.
      - xelis-data-2:/data2
      - xeldash-config:/config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - backend

  # Optional second node for redundancy: COMPOSE_PROFILES=redundant, and add it to
  # XELIS_RPC_URLS. It has its own chain data and image pin (XELIS_DAEMON2_IMAGE), so the two
  # nodes can be upgraded one at a time while mining continues on the other.
  daemon2:
    profiles: ["redundant"]
    build:
      context: docker/daemon
      args:
        XELIS_DAEMON_IMAGE: ${XELIS_DAEMON2_IMAGE:-${XELIS_DAEMON_IMAGE:-xelis/daemon:1.25.0}}
    command:
      - --network=${XELIS_NETWORK:-devnet}
      - --rpc-bind-address=0.0.0.0:8080
      - --dir-path=/root/.xelis/
      # A service name; the entrypoint resolves it to daemon's address on each start.
      - --priority-nodes=daemon:2125
    restart: unless-stopped
    environment:
      XELIS_NETWORK: ${XELIS_NETWORK:-devnet}
    volumes:
      - xelis-data-2:/root/.xelis
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "busybox", "sh", "-c", "test -f /root/.xelis/.xeldash/STOP || busybox wget -q -O - --header 'Content-Type: application/json' --post-data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"get_version\"}' http://127.0.0.1:8080/json_rpc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xeldash}
      POSTGRES_USER: ${POSTGRES_USER:-xeldash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # One-shot schema migration. api and stratum wait for it to complete successfully, so
  # neither service's startup depends on the other's health.
  migrate:
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/api:${XELDASH_VERSION:-local}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["node", "packages/db/src/migrate.js"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/api:${XELDASH_VERSION:-local}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8081
      # DNS lookups share libuv's thread pool; a stopped container's name takes seconds to fail.
      UV_THREADPOOL_SIZE: 16
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_EVENTS: ${ALERT_EVENTS:-}
      ALERT_WORKER_OFFLINE_MINUTES: ${ALERT_WORKER_OFFLINE_MINUTES:-10}
      ALERT_DASHBOARD_URL: ${ALERT_DASHBOARD_URL:-}
      # XEL price from CoinGecko, for viewers who switch it on; "off" disables it for everyone.
      XELDASH_PRICE: ${XELDASH_PRICE:-on}
      # What the dashboard's "Connect a miner" page shows: the published ports and this machine's
      # address on your network (set by the installer).
      CONNECT_HOST: ${XELDASH_PUBLIC_HOST:-}
      CONNECT_BIND_IP: ${XELDASH_STRATUM_BIND_IP:-127.0.0.1}
      CONNECT_STRATUM_PORT: ${XELDASH_STRATUM_PORT:-3333}
      CONNECT_TLS_PORT: ${XELDASH_STRATUM_TLS_PORT:-3334}
      CONNECT_GETWORK_PORT: ${XELDASH_GETWORK_PORT:-8090}
      STRATUM_TLS_ENABLED: ${STRATUM_TLS_ENABLED:-false}
      GETWORK_ENABLED: ${GETWORK_ENABLED:-true}
      XELIS_DEFAULT_ADDRESS: ${XELIS_DEFAULT_ADDRESS:-}
      # Asks GitHub for the latest XELIS release (every 6 hours) to flag outdated nodes.
      XELDASH_VERSION_CHECK: ${XELDASH_VERSION_CHECK:-on}
      XELIS_NETWORK: ${XELIS_NETWORK:-devnet}
      # Nodes in priority order; see docs/OPERATIONS.md#redundant-nodes.
      XELIS_RPC_URLS: ${XELIS_RPC_URLS:-http://daemon:8080/json_rpc}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # The mining fallback switch, written by node-admin.
      - xeldash-config:/config:ro
    depends_on:
      daemon:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${XELDASH_API_BIND_IP:-127.0.0.1}:${XELDASH_API_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  stratum:
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/stratum:${XELDASH_VERSION:-local}
    build:
      context: .
      dockerfile: services/stratum/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      STRATUM_HOST: 0.0.0.0
      STRATUM_PORT: 3333
      # Share hashing and DNS lookups share libuv's thread pool; this is also the number of
      # shares hashed in parallel.
      UV_THREADPOOL_SIZE: ${STRATUM_HASH_THREADS:-8}
      STRATUM_HANDSHAKE_TIMEOUT_MS: ${STRATUM_HANDSHAKE_TIMEOUT_MS:-10000}
      STRATUM_MAX_QUEUED_REQUESTS: ${STRATUM_MAX_QUEUED_REQUESTS:-32}
      STRATUM_JOB_REFRESH_MS: ${STRATUM_JOB_REFRESH_MS:-5000}
      STRATUM_STALE_GRACE_MS: ${STRATUM_STALE_GRACE_MS:-1500}
      STRATUM_START_DIFFICULTY: ${STRATUM_START_DIFFICULTY:-100000}
      STRATUM_MIN_DIFFICULTY: ${STRATUM_MIN_DIFFICULTY:-1000}
      STRATUM_TARGET_SHARE_SECONDS: ${STRATUM_TARGET_SHARE_SECONDS:-10}
      STRATUM_RETARGET_SECONDS: ${STRATUM_RETARGET_SECONDS:-60}
      STRATUM_RETARGET_SHARES: ${STRATUM_RETARGET_SHARES:-20}
      STRATUM_MAX_CONNECTIONS_PER_IP: ${STRATUM_MAX_CONNECTIONS_PER_IP:-64}
      STRATUM_MESSAGES_PER_SECOND: ${STRATUM_MESSAGES_PER_SECOND:-20}
      STRATUM_MESSAGE_BURST: ${STRATUM_MESSAGE_BURST:-40}
      STRATUM_BAN_WINDOW_SECONDS: ${STRATUM_BAN_WINDOW_SECONDS:-300}
      STRATUM_BAN_INVALID_COUNT: ${STRATUM_BAN_INVALID_COUNT:-50}
      STRATUM_BAN_INVALID_RATIO: ${STRATUM_BAN_INVALID_RATIO:-0.5}
      STRATUM_BAN_MINUTES: ${STRATUM_BAN_MINUTES:-15}
      STRATUM_BAN_EXEMPT_IPS: ${STRATUM_BAN_EXEMPT_IPS:-}
      RETENTION_RAW_SHARE_DAYS: ${RETENTION_RAW_SHARE_DAYS:-7}
      RETENTION_MINUTE_STATS_DAYS: ${RETENTION_MINUTE_STATS_DAYS:-90}
      STRATUM_TLS_ENABLED: ${STRATUM_TLS_ENABLED:-false}
      STRATUM_TLS_PORT: 3334
      GETWORK_ENABLED: ${GETWORK_ENABLED:-true}
      GETWORK_PORT: 8090
      XELIS_DEFAULT_ADDRESS: ${XELIS_DEFAULT_ADDRESS:-}
      # Nodes in priority order; see docs/OPERATIONS.md#redundant-nodes.
      XELIS_RPC_URLS: ${XELIS_RPC_URLS:-http://daemon:8080/json_rpc}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${XELDASH_STRATUM_TLS_DIR:-./docker/stratum-tls}:/tls:ro
      # The mining fallback switch, written by node-admin.
      - xeldash-config:/config:ro
    depends_on:
      daemon:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${XELDASH_STRATUM_BIND_IP:-127.0.0.1}:${XELDASH_STRATUM_PORT:-3333}:3333"
      - "${XELDASH_STRATUM_BIND_IP:-127.0.0.1}:${XELDASH_STRATUM_TLS_PORT:-3334}:3334"
      - "${XELDASH_STRATUM_BIND_IP:-127.0.0.1}:${XELDASH_GETWORK_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('node:net');const s=n.connect(3333,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1));"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

  web:
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/web:${XELDASH_VERSION:-local}
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      # nginx resolves the node-admin service's name at startup.
      node-admin:
        condition: service_started
    ports:
      - "${XELDASH_WEB_BIND_IP:-127.0.0.1}:${XELDASH_WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

  # Optional: HTTPS and a login in front of the dashboard (profile "proxy"). Keep the
  # dashboard's own port on loopback so this is the only way in from the LAN.
  # See docs/OPERATIONS.md#https-and-a-login.
  proxy:
    image: caddy:2.11-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      XELDASH_PROXY_HOST: ${XELDASH_PROXY_HOST:-}
      XELDASH_PROXY_USER: ${XELDASH_PROXY_USER:-admin}
      XELDASH_PROXY_PASSWORD_HASH: ${XELDASH_PROXY_PASSWORD_HASH:-}
    # Refuse to start half-configured: an empty host would answer any name, and an empty
    # hash would mean no login.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -z "$$XELDASH_PROXY_HOST" ] || [ -z "$$XELDASH_PROXY_PASSWORD_HASH" ]; then
        echo "Set XELDASH_PROXY_HOST and XELDASH_PROXY_PASSWORD_HASH in .env (see docs/OPERATIONS.md#https-and-a-login)"; exit 1; fi;
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps Caddy's local certificate authority, so devices only trust it once.
      - proxy-data:/data
    ports:
      - "${XELDASH_PROXY_BIND_IP:-127.0.0.1}:${XELDASH_PROXY_PORT:-8443}:443"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - backend

  # Optional: `docker compose --profile backup up -d`. Dumps the database to ./backups every
  # BACKUP_INTERVAL_HOURS and keeps the newest BACKUP_KEEP. See docs/OPERATIONS.md.
  backup:
    image: postgres:17-alpine
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/xeldash-backup.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/xeldash-backup.sh:ro
      - ${XELDASH_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

volumes:
  xelis-data:
  xelis-data-2:
  xeldash-config:
  postgres-data:
  proxy-data:

networks:
  backend:
    driver: bridge
