name: xeldash

# Images are built locally by default (tag `local`). To run a release instead, set
# XELDASH_VERSION (for example 0.1.0) and run `docker compose pull && docker compose up -d`.

# Every container's log is rotated: at most XELDASH_LOG_FILES files of XELDASH_LOG_MAX_SIZE each (50 MB by default), so a
# busy public server or a noisy miner cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${XELDASH_LOG_MAX_SIZE:-10m}
    max-file: "${XELDASH_LOG_FILES:-5}"

services:
  daemon:
    logging: *logging
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/daemon:${XELDASH_VERSION:-local}
    build:
      context: docker/daemon
      args:
        XELIS_DAEMON_IMAGE: ${XELIS_DAEMON_IMAGE:-xelis/daemon:1.25.0}
    command:
      - --network=${XELIS_NETWORK:-devnet}
      - --rpc-bind-address=0.0.0.0:8080
      - --dir-path=/root/.xelis/
    restart: unless-stopped
    environment:
      # The entrypoint needs the network to find the database when swapping in a snapshot.
      XELIS_NETWORK: ${XELIS_NETWORK:-devnet}
    volumes:
      - xelis-data:/root/.xelis
    depends_on:
      # On a first start with XELIS_SNAPSHOT_AUTO, node-admin holds the node back until the
      # official snapshot is downloaded and unpacked.
      node-admin:
        condition: service_healthy
    ports:
      - "${XELIS_P2P_BIND_IP:-127.0.0.1}:${XELIS_P2P_PORT:-2125}:2125"
    expose:
      - "8080"
    healthcheck:
      # Waiting for a first-start snapshot counts as healthy, so the dashboard (which shows the
      # download) and Stratum (which pauses until the node is ready) can start meanwhile.
      test: ["CMD", "busybox", "sh", "-c", "test -f /root/.xelis/.xeldash/BOOTSTRAPPING || test -f /root/.xelis/.xeldash/STOP || busybox wget -q -O - --header 'Content-Type: application/json' --post-data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"get_version\"}' http://127.0.0.1:8080/json_rpc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - node

  # Node administration for the dashboard: daemon settings and snapshots, written to the node's
  # data volume and applied when the node restarts. Actions need XELDASH_ADMIN_TOKEN.
  # See docs/OPERATIONS.md#daemon-settings and #snapshots.
  node-admin:
    logging: *logging
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/node-admin:${XELDASH_VERSION:-local}
    build:
      context: .
      dockerfile: services/node-admin/Dockerfile
    restart: unless-stopped
    environment:
      XELIS_NETWORK: ${XELIS_NETWORK:-devnet}
      XELDASH_ADMIN_TOKEN: ${XELDASH_ADMIN_TOKEN:-}
      XELIS_SNAPSHOT_AUTO: ${XELIS_SNAPSHOT_AUTO:-false}
      XELIS_SNAPSHOT_URL: ${XELIS_SNAPSHOT_URL:-}
      XELIS_SNAPSHOT_CHECKSUM_URL: ${XELIS_SNAPSHOT_CHECKSUM_URL:-}
      # Mining fallback through the official public node; the dashboard switch overrides it.
      XELIS_OFFICIAL_FALLBACK: ${XELIS_OFFICIAL_FALLBACK:-false}
      XELIS_OFFICIAL_NODE_URL: ${XELIS_OFFICIAL_NODE_URL:-}
      # Optional, off by default: update both local nodes to new releases by themselves (needs
      # the redundant profile). The dashboard switch overrides it after the first start.
      XELIS_AUTO_UPDATE: ${XELIS_AUTO_UPDATE:-false}
      # 24 by default; at least 36 on a public server.
      XELIS_AUTO_UPDATE_DELAY_HOURS: ${XELIS_AUTO_UPDATE_DELAY_HOURS:-24}
      # Public mode: automatic node updates only with XELIS_AUTO_UPDATE=true in .env, and at least 36 h after a release.
      XELDASH_PUBLIC_MODE: ${XELDASH_PUBLIC_MODE:-false}
      # Warn (on the dashboard and as an alert) when the nodes' disk has less free space than this.
      XELDASH_DISK_WARN_GB: ${XELDASH_DISK_WARN_GB:-20}
      # The address to mine to, chosen on the dashboard's setup page; this is its first value.
      XELIS_DEFAULT_ADDRESS: ${XELIS_DEFAULT_ADDRESS:-}
      # Node actions (version switches, stops, copies) are recorded as events for the
      # dashboard and alerts.
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - xelis-data:/data
      # daemon2's data (redundant profile), so its snapshots and settings can be managed too.
      - xelis-data-2:/data2
      - xeldash-config:/config
      # A folder on the computer's own drive, read-only, to read that drive's free space (Docker Desktop's
      # virtual disk reports its own size). Nothing is read from it.
      - ./docker/hostdisk:/hostdisk:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8095/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - edge
      - node
      - data

  # Optional second node for redundancy: COMPOSE_PROFILES=redundant, and add it to
  # XELIS_RPC_URLS. It has its own chain data and image pin (XELIS_DAEMON2_IMAGE), so the two
  # nodes can be upgraded one at a time while mining continues on the other.
  daemon2:
    logging: *logging
    profiles: ["redundant"]
    build:
      context: docker/daemon
      args:
        XELIS_DAEMON_IMAGE: ${XELIS_DAEMON2_IMAGE:-${XELIS_DAEMON_IMAGE:-xelis/daemon:1.25.0}}
    command:
      - --network=${XELIS_NETWORK:-devnet}
      - --rpc-bind-address=0.0.0.0:8080
      - --dir-path=/root/.xelis/
      # A service name; the entrypoint resolves it to daemon's address on each start.
      - --priority-nodes=daemon:2125
    restart: unless-stopped
    environment:
      XELIS_NETWORK: ${XELIS_NETWORK:-devnet}
    volumes:
      - xelis-data-2:/root/.xelis
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "busybox", "sh", "-c", "test -f /root/.xelis/.xeldash/STOP || busybox wget -q -O - --header 'Content-Type: application/json' --post-data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"get_version\"}' http://127.0.0.1:8080/json_rpc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - node

  postgres:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xeldash}
      POSTGRES_USER: ${POSTGRES_USER:-xeldash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data

  # One-shot schema migration. api and stratum wait for it to complete successfully, so
  # neither service's startup depends on the other's health.
  migrate:
    logging: *logging
    # The API's image, built (or pulled) by the api service. Building it here as well would give the same tag two different images
    # (each build is labelled with its service), so every update would recreate the API, and everything after it, for nothing.
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/api:${XELDASH_VERSION:-local}
    pull_policy: never
    command: ["node", "packages/db/src/migrate.js"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  api:
    logging: *logging
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/api:${XELDASH_VERSION:-local}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8081
      # DNS lookups share libuv's thread pool; a stopped container's name takes seconds to fail.
      UV_THREADPOOL_SIZE: 16
      # The released version in use, so the dashboard can tell when a newer one comes out.
      XELDASH_VERSION: ${XELDASH_VERSION:-}
      # Shared with the standby server of a redundancy cluster (xeldash cluster setup), which sends its records here.
      XELDASH_CLUSTER_SECRET: ${XELDASH_CLUSTER_SECRET:-}
      # Where to look for newer versions; set it if you run a fork.
      XELDASH_UPDATE_REPO: ${XELDASH_UPDATE_REPO:-}
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_EVENTS: ${ALERT_EVENTS:-}
      ALERT_WORKER_OFFLINE_MINUTES: ${ALERT_WORKER_OFFLINE_MINUTES:-10}
      ALERT_DASHBOARD_URL: ${ALERT_DASHBOARD_URL:-}
      # Public mode: visitors get no IP addresses, no connection problems and no node administration (docs/OPERATIONS.md#public-mode).
      XELDASH_PUBLIC_MODE: ${XELDASH_PUBLIC_MODE:-false}
      # Read only to warn about risky public-mode settings at startup.
      XELDASH_PUBLIC_DOMAIN: ${XELDASH_PUBLIC_DOMAIN:-}
      XELDASH_ALLOWED_NETWORKS: ${XELDASH_ALLOWED_NETWORKS:-private}
      # XEL price from CoinGecko, for viewers who switch it on; "off" disables it for everyone.
      XELDASH_PRICE: ${XELDASH_PRICE:-on}
      # What the dashboard's "Connect a miner" page shows: the published ports and this machine's
      # address on your network (set by the installer).
      CONNECT_HOST: ${XELDASH_PUBLIC_HOST:-}
      CONNECT_BIND_IP: ${XELDASH_STRATUM_BIND_IP:-127.0.0.1}
      # Where this API's own port is published (below): a public server warns unless it is this computer only.
      API_BIND_IP: ${XELDASH_API_BIND_IP:-127.0.0.1}
      CONNECT_STRATUM_PORT: ${XELDASH_STRATUM_PORT:-3333}
      CONNECT_TLS_PORT: ${XELDASH_STRATUM_TLS_PORT:-3334}
      CONNECT_GETWORK_PORT: ${XELDASH_GETWORK_PORT:-8090}
      STRATUM_TLS_ENABLED: ${STRATUM_TLS_ENABLED:-false}
      GETWORK_ENABLED: ${GETWORK_ENABLED:-true}
      XELIS_DEFAULT_ADDRESS: ${XELIS_DEFAULT_ADDRESS:-}
      # Asks GitHub for the latest XELIS release (every 6 hours) to flag outdated nodes.
      XELDASH_VERSION_CHECK: ${XELDASH_VERSION_CHECK:-on}
      XELIS_NETWORK: ${XELIS_NETWORK:-devnet}
      # Nodes in priority order; see docs/OPERATIONS.md#redundant-nodes.
      XELIS_RPC_URLS: ${XELIS_RPC_URLS:-http://daemon:8080/json_rpc}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # The mining fallback switch, written by node-admin.
      - xeldash-config:/config:ro
    depends_on:
      daemon:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${XELDASH_API_BIND_IP:-127.0.0.1}:${XELDASH_API_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge
      - node
      - data

  stratum:
    logging: *logging
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/stratum:${XELDASH_VERSION:-local}
    build:
      context: .
      dockerfile: services/stratum/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      STRATUM_HOST: 0.0.0.0
      STRATUM_PORT: 3333
      # Share hashing and DNS lookups share libuv's thread pool; this is also the number of
      # shares hashed in parallel.
      UV_THREADPOOL_SIZE: ${STRATUM_HASH_THREADS:-8}
      # Addresses of a front door (xeldash frontdoor setup) whose PROXY line names the real miner; empty = none.
      STRATUM_PROXY_FROM: ${STRATUM_PROXY_FROM:-}
      # Public mode: every miner must log in with its own address; the default address is not used.
      XELDASH_PUBLIC_MODE: ${XELDASH_PUBLIC_MODE:-false}
      # Prometheus metrics (docs/OPERATIONS.md#metrics): on with the `metrics` profile (or XELDASH_METRICS=on), and published by the
      # profile's forwarder. Stratum is told where it is published, so in public mode it can refuse a port open beyond this computer.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      XELDASH_METRICS: ${XELDASH_METRICS:-}
      XELDASH_METRICS_BIND_IP: ${XELDASH_METRICS_BIND_IP:-127.0.0.1}
      XELDASH_METRICS_TOKEN: ${XELDASH_METRICS_TOKEN:-}
      XELDASH_METRICS_PER_WORKER: ${XELDASH_METRICS_PER_WORKER:-}
      STRATUM_HANDSHAKE_TIMEOUT_MS: ${STRATUM_HANDSHAKE_TIMEOUT_MS:-10000}
      STRATUM_MAX_QUEUED_REQUESTS: ${STRATUM_MAX_QUEUED_REQUESTS:-32}
      # Where Stratum keeps records while the database cannot be reached, and replays them when it is back.
      STRATUM_JOURNAL_DIR: /spool
      STRATUM_JOURNAL_MAX_MB: ${STRATUM_JOURNAL_MAX_MB:-200}
      STRATUM_JOB_REFRESH_MS: ${STRATUM_JOB_REFRESH_MS:-5000}
      STRATUM_STALE_GRACE_MS: ${STRATUM_STALE_GRACE_MS:-1500}
      STRATUM_START_DIFFICULTY: ${STRATUM_START_DIFFICULTY:-100000}
      STRATUM_MIN_DIFFICULTY: ${STRATUM_MIN_DIFFICULTY:-1000}
      STRATUM_TARGET_SHARE_SECONDS: ${STRATUM_TARGET_SHARE_SECONDS:-5}
      STRATUM_RETARGET_SECONDS: ${STRATUM_RETARGET_SECONDS:-60}
      STRATUM_RETARGET_SHARES: ${STRATUM_RETARGET_SHARES:-20}
      # Empty: 64, or 1000 on a public server (a farm behind one IP address).
      STRATUM_MAX_CONNECTIONS_PER_IP: ${STRATUM_MAX_CONNECTIONS_PER_IP:-}
      # Public-server limits; empty: the public defaults there (5000 connections, 100 node calls a second, and per IP address 32
      # addresses, 1000 new worker names an hour and 300 shares a second), none otherwise. See docs/OPERATIONS.md#public-mode.
      STRATUM_MAX_CONNECTIONS: ${STRATUM_MAX_CONNECTIONS:-}
      STRATUM_NODE_CALLS_PER_SECOND: ${STRATUM_NODE_CALLS_PER_SECOND:-}
      STRATUM_MAX_ADDRESSES_PER_IP: ${STRATUM_MAX_ADDRESSES_PER_IP:-}
      STRATUM_NEW_WORKERS_PER_IP_PER_HOUR: ${STRATUM_NEW_WORKERS_PER_IP_PER_HOUR:-}
      STRATUM_SHARES_PER_IP_PER_SECOND: ${STRATUM_SHARES_PER_IP_PER_SECOND:-}
      STRATUM_MESSAGES_PER_SECOND: ${STRATUM_MESSAGES_PER_SECOND:-20}
      STRATUM_MESSAGE_BURST: ${STRATUM_MESSAGE_BURST:-40}
      STRATUM_BAN_WINDOW_SECONDS: ${STRATUM_BAN_WINDOW_SECONDS:-300}
      STRATUM_BAN_INVALID_COUNT: ${STRATUM_BAN_INVALID_COUNT:-50}
      STRATUM_BAN_INVALID_RATIO: ${STRATUM_BAN_INVALID_RATIO:-0.5}
      STRATUM_BAN_MINUTES: ${STRATUM_BAN_MINUTES:-15}
      STRATUM_BAN_EXEMPT_IPS: ${STRATUM_BAN_EXEMPT_IPS:-}
      # Who may connect: "private" (this computer and your home network), "any", or a list of
      # networks. Stratum, Stratum TLS and getwork all check it.
      XELDASH_ALLOWED_NETWORKS: ${XELDASH_ALLOWED_NETWORKS:-private}
      # Empty: 7 days, or 1 on a public server.
      RETENTION_RAW_SHARE_DAYS: ${RETENTION_RAW_SHARE_DAYS:-}
      RETENTION_MINUTE_STATS_DAYS: ${RETENTION_MINUTE_STATS_DAYS:-90}
      RETENTION_EVENT_DAYS: ${RETENTION_EVENT_DAYS:-365}
      RETENTION_UNUSED_WORKER_DAYS: ${RETENTION_UNUSED_WORKER_DAYS:-1}
      STRATUM_TLS_ENABLED: ${STRATUM_TLS_ENABLED:-false}
      STRATUM_TLS_PORT: 3334
      # Empty: /tls/cert.pem and /tls/key.pem (XELDASH_STRATUM_TLS_DIR). A public server with the public-https profile can use its
      # domain's certificate: /public-tls/cert.pem and /public-tls/key.pem.
      STRATUM_TLS_CERT_FILE: ${STRATUM_TLS_CERT_FILE:-}
      STRATUM_TLS_KEY_FILE: ${STRATUM_TLS_KEY_FILE:-}
      GETWORK_ENABLED: ${GETWORK_ENABLED:-true}
      GETWORK_PORT: 8090
      XELIS_DEFAULT_ADDRESS: ${XELIS_DEFAULT_ADDRESS:-}
      # Nodes in priority order; see docs/OPERATIONS.md#redundant-nodes.
      XELIS_RPC_URLS: ${XELIS_RPC_URLS:-http://daemon:8080/json_rpc}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${XELDASH_STRATUM_TLS_DIR:-./docker/stratum-tls}:/tls:ro
      - public-tls:/public-tls:ro
      - xeldash-spool:/spool
      # The mining fallback switch, written by node-admin.
      - xeldash-config:/config:ro
    depends_on:
      daemon:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${XELDASH_STRATUM_BIND_IP:-127.0.0.1}:${XELDASH_STRATUM_PORT:-3333}:3333"
      - "${XELDASH_STRATUM_BIND_IP:-127.0.0.1}:${XELDASH_STRATUM_TLS_PORT:-3334}:3334"
      - "${XELDASH_STRATUM_BIND_IP:-127.0.0.1}:${XELDASH_GETWORK_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3333"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - node
      - data
      - metrics

  web:
    logging: *logging
    environment:
      XELDASH_ALLOWED_NETWORKS: ${XELDASH_ALLOWED_NETWORKS:-private}
      # In public mode this is the public view: no node administration, and no IP addresses from the API.
      XELDASH_PUBLIC_MODE: ${XELDASH_PUBLIC_MODE:-false}
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/web:${XELDASH_VERSION:-local}
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      # nginx resolves the node-admin service's name at startup.
      node-admin:
        condition: service_started
    ports:
      - "${XELDASH_WEB_BIND_IP:-127.0.0.1}:${XELDASH_WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge

  # Public mode only (profile "public"): the operator's own dashboard, with node administration, connection problems and
  # miners' IP addresses. Published on this computer's loopback only (fixed here, not a setting), so reach it on the server or
  # through an SSH tunnel. See docs/OPERATIONS.md#public-mode.
  admin-web:
    logging: *logging
    image: ${XELDASH_IMAGE_REGISTRY:-ghcr.io/pitanu/xeldash}/web:${XELDASH_VERSION:-local}
    profiles: ["public"]
    environment:
      XELDASH_PUBLIC_MODE: ${XELDASH_PUBLIC_MODE:-false}
      XELDASH_WEB_VIEW: admin
      # Your own network only, whatever XELDASH_ALLOWED_NETWORKS says for the public site.
      XELDASH_ALLOWED_NETWORKS: private
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      node-admin:
        condition: service_started
    ports:
      - "127.0.0.1:${XELDASH_ADMIN_WEB_PORT:-8089}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge

  # Optional: HTTPS and a login in front of the dashboard (profile "proxy"). Keep the
  # dashboard's own port on loopback so this is the only way in from the LAN.
  # See docs/OPERATIONS.md#https-and-a-login.
  proxy:
    logging: *logging
    image: caddy:2.11-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      XELDASH_PROXY_HOST: ${XELDASH_PROXY_HOST:-}
      XELDASH_PROXY_USER: ${XELDASH_PROXY_USER:-admin}
      XELDASH_PROXY_PASSWORD_HASH: ${XELDASH_PROXY_PASSWORD_HASH:-}
    # Refuse to start half-configured: an empty host would answer any name, and an empty
    # hash would mean no login.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -z "$$XELDASH_PROXY_HOST" ] || [ -z "$$XELDASH_PROXY_PASSWORD_HASH" ]; then
        echo "Set XELDASH_PROXY_HOST and XELDASH_PROXY_PASSWORD_HASH in .env (see docs/OPERATIONS.md#https-and-a-login)"; exit 1; fi;
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps Caddy's local certificate authority, so devices only trust it once.
      - proxy-data:/data
    ports:
      - "${XELDASH_PROXY_BIND_IP:-127.0.0.1}:${XELDASH_PROXY_PORT:-8443}:443"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge

  # Public mode only (profile "public-https"): HTTPS for the public dashboard with a real Let's Encrypt certificate for
  # XELDASH_PUBLIC_DOMAIN, and no login. Needs ports 80 and 443 reachable from the internet and the domain pointing at this server.
  # Not the "proxy" profile: that one asks for a login and uses a local certificate, for a private dashboard.
  public-https:
    logging: *logging
    image: caddy:2.11-alpine
    profiles: ["public-https"]
    restart: unless-stopped
    environment:
      XELDASH_PUBLIC_DOMAIN: ${XELDASH_PUBLIC_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$XELDASH_PUBLIC_DOMAIN" ]; then
          echo "Set XELDASH_PUBLIC_DOMAIN in .env (see docs/OPERATIONS.md#public-mode)"; exit 1
        fi
        # Stratum TLS can use the same certificate (docs/OPERATIONS.md#public-mode): a copy, readable by Stratum's user, is kept in
        # the public-tls volume and refreshed within five minutes of each renewal. Caddy's own files (and its account key) stay here.
        domain=$$(echo "$$XELDASH_PUBLIC_DOMAIN" | tr 'A-Z' 'a-z')
        copy_certificate() {
          crt=$$(find /data/caddy/certificates -path "*/$$domain/$$domain.crt" -exec ls -t {} + 2>/dev/null | head -n 1)
          [ -n "$$crt" ] || return 0
          key="$${crt%.crt}.key"
          if cmp -s "$$crt" /public-tls/cert.pem && cmp -s "$$key" /public-tls/key.pem; then return 0; fi
          cp "$$key" /public-tls/key.pem.new && cp "$$crt" /public-tls/cert.pem.new \
            && chown 1000:1000 /public-tls/key.pem.new /public-tls/cert.pem.new \
            && chmod 600 /public-tls/key.pem.new && chmod 644 /public-tls/cert.pem.new \
            && mv /public-tls/key.pem.new /public-tls/key.pem && mv /public-tls/cert.pem.new /public-tls/cert.pem \
            && echo "Copied the certificate for $$domain for Stratum TLS"
        }
        (while true; do copy_certificate; sleep 300; done) &
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./docker/proxy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      # Keeps the certificate, so it is not requested again on every restart.
      - public-https-data:/data
      - public-tls:/public-tls
    ports:
      - "${XELDASH_PUBLIC_HTTPS_BIND_IP:-0.0.0.0}:80:80"
      - "${XELDASH_PUBLIC_HTTPS_BIND_IP:-0.0.0.0}:443:443"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge

  # Optional: `docker compose --profile backup up -d`. Dumps the database to ./backups every
  # BACKUP_INTERVAL_HOURS and keeps the newest BACKUP_KEEP. See docs/OPERATIONS.md.
  backup:
    logging: *logging
    image: postgres:17-alpine
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/xeldash-backup.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-xeldash}
      PGUSER: ${POSTGRES_USER:-xeldash}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/xeldash-backup.sh:ro
      - ${XELDASH_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  # Prometheus metrics (profile `metrics`, docs/OPERATIONS.md#metrics): publishes Stratum's metrics port on this computer, and only
  # that. A forwarder, so Stratum publishes nothing and a server without the profile has no port open for it.
  metrics:
    logging: *logging
    image: nginx:1.31-alpine
    profiles: ["metrics"]
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./docker/metrics/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${XELDASH_METRICS_BIND_IP:-127.0.0.1}:${XELDASH_METRICS_PORT:-9464}:9464"
    depends_on:
      - stratum
    networks:
      - metrics

volumes:
  xelis-data:
  xelis-data-2:
  xeldash-config:
  xeldash-spool:
  postgres-data:
  proxy-data:
  public-https-data:
  # The public domain's certificate, copied by public-https for Stratum TLS.
  public-tls:

# Three networks, so a service can only reach what it needs:
#   edge  the dashboard and the HTTPS proxy: they reach the API and node admin, nothing else.
#         (They cannot reach the database, the node's RPC or the mining server.)
#   node  the XELIS nodes and the services that talk to them.
#   data  PostgreSQL and the services that use it. Internal: nothing outside can reach it, and it
#         cannot reach out.
networks:
  edge:
  node:
  data:
    internal: true
  # Stratum and the metrics forwarder only. Not internal: Docker publishes no port from a container on internal networks only.
  metrics:
