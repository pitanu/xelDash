# The `metrics` Compose profile (docs/OPERATIONS.md#metrics): forwards the published metrics port to Stratum's, over a network only
# the two share, so Stratum itself publishes nothing. Stratum answers, and checks the token; this only passes bytes along.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

stream {
  # Docker's DNS, looked up again every 10 s: an update recreates Stratum with a new address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $server_port $stratum_metrics {
    default stratum:9464;
  }
  server {
    listen 9464;
    proxy_pass $stratum_metrics;
    proxy_connect_timeout 5s;
    proxy_timeout 30s;
  }
}
