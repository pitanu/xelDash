# Security headers for every dashboard response. nginx drops server-level add_header lines in
# any location that sets its own, so each such location includes this file again.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
# The dashboard runs admin actions; it must never be framed by another site (clickjacking).
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
