# Serves the built dashboard and proxies /api to the API service on the Compose network.

# Request limits for a public server's public view (docs/OPERATIONS.md#public-mode). Their keys are set in view.conf: the visitor's
# address there, empty everywhere else, and nginx does not count a request whose key is empty. So a normal dashboard and the
# operator's admin web are not limited; the public view is, per visitor and in all.
limit_req_zone $limit_ip zone=api_per_ip:10m rate=10r/s;
limit_req_zone $limit_ip zone=csv_per_ip:10m rate=6r/m;
limit_req_zone $limit_ip zone=page_per_ip:10m rate=30r/s;
limit_req_zone $limit_all zone=api_all:1m rate=200r/s;
limit_conn_zone $limit_ip zone=conn_per_ip:10m;
limit_conn_zone $limit_ip zone=live_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

# The host names this dashboard answers to (docker/web/42-allowed-hosts.sh): $xeldash_host_ok is 0 for any other, such as a
# website's own domain pointed at this address (DNS rebinding).
include /etc/nginx/snippets/allowed-hosts.conf;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  # Which view this web server gives (docker/web/41-view.sh): "operator", or "public" in public mode. Sent to the API on every
  # request, replacing anything a visitor sends, so a visitor cannot claim the operator's view. It also sets the limit keys
  # above, and for the public view the visitor's real address behind the HTTPS proxy, short timeouts and a cap on open
  # connections per visitor.
  include /etc/nginx/snippets/view.conf;

  # Who may open the dashboard: your own network by default (XELDASH_ALLOWED_NETWORKS).
  include /etc/nginx/snippets/allowed-networks.conf;

  # Only under a name that belongs here (above): another website's domain gets nothing, the page included.
  if ($xeldash_host_ok = 0) {
    return 421;
  }

  # Look the services up again as they are recreated (Docker's own DNS), instead of keeping
  # the address they had when nginx started: an updated API no longer leaves the dashboard on
  # a 502 until the web container restarts. Using variables also lets nginx start before them.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:8081;
  set $admin_upstream http://node-admin:8095;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Xeldash-View $xeldash_view;
    # A standby server's batches (see services/api/src/ingest.js) can be a few megabytes.
    client_max_body_size 5m;
    limit_req zone=api_per_ip burst=20 nodelay;
    limit_req zone=api_all burst=100 nodelay;
  }

  # Every block as a spreadsheet: the most work for the database of any request, so a visitor gets a few a minute.
  location = /api/v1/blocks.csv {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Xeldash-View $xeldash_view;
    limit_req zone=csv_per_ip burst=2 nodelay;
    limit_req zone=api_all burst=100 nodelay;
  }

  # On-time as a spreadsheet (up to 90 days of stretches), within the same few a minute.
  location = /api/v1/activity.csv {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Xeldash-View $xeldash_view;
    limit_req zone=csv_per_ip burst=2 nodelay;
    limit_req zone=api_all burst=100 nodelay;
  }

  # Node administration (settings, snapshots): proxied to node-admin, or a 404 on a public server's public view.
  include /etc/nginx/snippets/node-route.conf;

  # Live updates: WebSocket upgrade, kept open well past the API's 30 s heartbeat. A few per visitor.
  location = /api/v1/live {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Xeldash-View $xeldash_view;
    proxy_read_timeout 1h;
    limit_conn live_per_ip 4;
    limit_req zone=api_per_ip burst=20 nodelay;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    limit_req zone=page_per_ip burst=60 nodelay;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control no-cache;
    include /etc/nginx/snippets/security-headers.conf;
    limit_req zone=page_per_ip burst=60 nodelay;
  }
}
