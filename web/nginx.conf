# Serves the built dashboard and proxies /api to the API service on the Compose network.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  # Look the services up again as they are recreated (Docker's own DNS), instead of keeping
  # the address they had when nginx started: an updated API no longer leaves the dashboard on
  # a 502 until the web container restarts. Using variables also lets nginx start before them.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:8081;
  set $admin_upstream http://node-admin:8095;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  # Node administration (settings, snapshots). Snapshot uploads can be many gigabytes: no size
  # limit, streamed straight to node-admin instead of buffered, and no short timeouts.
  location /api/v1/node/ {
    proxy_pass $admin_upstream;
    proxy_set_header Host $host;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 2h;
    proxy_send_timeout 2h;
    client_body_timeout 2h;
  }

  # Live updates: WebSocket upgrade, kept open well past the API's 30 s heartbeat.
  location = /api/v1/live {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control no-cache;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
