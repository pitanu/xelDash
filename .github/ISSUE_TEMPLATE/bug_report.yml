name: Bug report
description: Something in xelDash does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: xelDash version
      description: A release tag (for example 0.1.0), or the commit if you build from source.
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [mainnet, testnet, devnet]
    validations:
      required: true
  - type: input
    id: daemon
    attributes:
      label: XELIS daemon version
      description: Shown on the dashboard's Health page.
  - type: input
    id: miner
    attributes:
      label: Miner software and version
      description: For example SRBMiner 2.x, lolMiner 1.x, xelis_miner 1.21.3. Say whether it connects over Stratum, TLS or getwork.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Relevant lines from `docker compose logs stratum api` (remove anything private)."
      render: text
