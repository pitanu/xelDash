name: Miner compatibility report
description: Tell us whether a miner works with xelDash
labels: [compatibility]
body:
  - type: input
    id: miner
    attributes:
      label: Miner software and version
      description: For example SRBMiner-MULTI 2.9.0.
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [Stratum, Stratum over TLS, Getwork]
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works (shares accepted, blocks found or none expected yet)
        - Partly works
        - Does not work
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: GPU or CPU model.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Miner command line (without secrets), what you saw, and any Stratum log lines.
      render: text
