# Weekly version updates, grouped so a week's worth arrives as one pull request per area rather than many.
# Security updates are separate and arrive as soon as they exist (a repository setting).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      npm-root:
        patterns: ["*"]
    ignore:
      # The services run on Node 26: its types move with it, deliberately, not ahead of it (that would allow calls the runtime does not have).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      npm-web:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /packages/xelis-hash
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /docker/daemon
      - /docker/frontdoor
      - /docker/keepalived
      - /docker/standby-web
      - /services/api
      - /services/node-admin
      - /services/stratum
      - /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Moving the services to a newer Node major is a deliberate step (tests, the typecheck's types and CI move with it), not a weekly bump.
      # Odd-numbered Node releases are short-lived; move from one LTS to the next.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
