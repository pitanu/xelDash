name: Release images

# Push a tag like v0.1.0 to publish multi-arch images to GitHub Container Registry:
#   ghcr.io/<owner>/xeldash/{api,stratum,web,node-admin,daemon,keepalived,standby-web,frontdoor}:<version>
# A release candidate (v0.1.0-rc.1) gets only its own version tag; :latest is set by a final version. The typecheck and the tests
# run first, and nothing is published if they fail.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  images:
    name: Publish ${{ matrix.image }} image
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: services/api/Dockerfile
          - image: stratum
            context: .
            dockerfile: services/stratum/Dockerfile
          - image: web
            context: .
            dockerfile: web/Dockerfile
          - image: node-admin
            context: .
            dockerfile: services/node-admin/Dockerfile
          - image: daemon
            context: docker/daemon
            dockerfile: docker/daemon/Dockerfile
          # The two-server cluster (Linux): the shared-address manager, and the standby server's web page.
          - image: keepalived
            context: docker/keepalived
            dockerfile: docker/keepalived/Dockerfile
          - image: standby-web
            context: docker/standby-web
            dockerfile: docker/standby-web/Dockerfile
          - image: frontdoor
            context: docker/frontdoor
            dockerfile: docker/frontdoor/Dockerfile
    steps:
      - uses: actions/checkout@v7
      # arm64 stages run under emulation; the Rust addon cross-compiles natively instead.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Registry paths must be lowercase.
          images: ghcr.io/${{ github.repository_owner }}/xeldash/${{ matrix.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
