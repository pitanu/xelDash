name: Release images

# Push a tag like v0.1.0 to publish multi-arch images to GitHub Container Registry:
#   ghcr.io/<owner>/xeldash/{api,stratum,web,node-admin,daemon,keepalived,standby-web,frontdoor}:<version>
# A release candidate (v0.1.0-rc.1) gets only its own version tag; :latest is set by a final version. The typecheck and the tests
# run first, and nothing is published if they fail. The GitHub release is created last, once every image is published.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The VERSION file matches the tag
        run: |
          if [ "$(tr -d '[:space:]' < VERSION)" != "${GITHUB_REF_NAME#v}" ]; then
            echo "VERSION says $(cat VERSION) but the tag is $GITHUB_REF_NAME. Make release tags with scripts/tag-release.sh." >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  images:
    name: Publish ${{ matrix.image }} image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: services/api/Dockerfile
          - image: stratum
            context: .
            dockerfile: services/stratum/Dockerfile
          - image: web
            context: .
            dockerfile: web/Dockerfile
          - image: node-admin
            context: .
            dockerfile: services/node-admin/Dockerfile
          - image: daemon
            context: docker/daemon
            dockerfile: docker/daemon/Dockerfile
          # The two-server cluster (Linux): the shared-address manager, and the standby server's web page.
          - image: keepalived
            context: docker/keepalived
            dockerfile: docker/keepalived/Dockerfile
          - image: standby-web
            context: docker/standby-web
            dockerfile: docker/standby-web/Dockerfile
          - image: frontdoor
            context: docker/frontdoor
            dockerfile: docker/frontdoor/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # arm64 stages run under emulation; the Rust addon cross-compiles natively instead.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Registry paths must be lowercase.
          images: ghcr.io/${{ github.repository_owner }}/xeldash/${{ matrix.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

  # The last step, on purpose: `xeldash update` and the dashboard's "new version" notice look at published releases, not tags, so
  # nobody is offered a version before all of its images exist. If anything above fails, the tag stays unannounced.
  release:
    name: Publish the GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release (a pre-release for a version with a suffix such as -rc.1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release."
            exit 0
          fi
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $flags
