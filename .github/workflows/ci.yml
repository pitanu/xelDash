name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Validate Compose file
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only

  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: services/api/Dockerfile
          - image: stratum
            context: .
            dockerfile: services/stratum/Dockerfile
          - image: web
            context: .
            dockerfile: web/Dockerfile
          - image: snapshot
            context: .
            dockerfile: services/snapshot/Dockerfile
          - image: daemon
            context: docker/daemon
            dockerfile: docker/daemon/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # amd64 only here; the release workflow builds and publishes both architectures.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
